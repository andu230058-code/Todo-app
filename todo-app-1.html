<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today's list</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ====================================================================
// STEP A: PASTE YOUR OWN VALUES HERE — replace the two placeholder lines below
// ====================================================================
const SUPABASE_URL = "https://ohvqtnuikmduijbenssc.supabase.co";        // e.g. "https://ohvqtnuikmduijbenssc.supabase.co"
const SUPABASE_KEY = "sb_publishable_sPIkB9vNqCSPgrl6vOXxDg_kUA8kPLG";    // e.g. "sb_publishable_xxxxxxxx"
// ====================================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function TodoApp() {
  const [tasks, setTasks] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  // Load tasks from Supabase when the app starts
  useEffect(() => {
    fetchTasks();
  }, []);

  async function fetchTasks() {
    setLoading(true);
    const { data, error } = await supabase
      .from("tasks")
      .select("*")
      .order("created_at", { ascending: true });
    if (error) {
      setError(error.message);
    } else {
      setTasks(data);
      setError(null);
    }
    setLoading(false);
  }

  async function addTask() {
    const trimmed = input.trim();
    if (!trimmed) return;
    const { data, error } = await supabase
      .from("tasks")
      .insert([{ text: trimmed, done: false }])
      .select();
    if (error) {
      setError(error.message);
    } else {
      setTasks((prev) => [...prev, ...data]);
      setInput("");
      setError(null);
    }
  }

  async function toggleTask(id, currentDone) {
    const { error } = await supabase
      .from("tasks")
      .update({ done: !currentDone })
      .eq("id", id);
    if (error) {
      setError(error.message);
    } else {
      setTasks((prev) =>
        prev.map((t) => (t.id === id ? { ...t, done: !currentDone } : t))
      );
    }
  }

  async function deleteTask(id) {
    const { error } = await supabase.from("tasks").delete().eq("id", id);
    if (error) {
      setError(error.message);
    } else {
      setTasks((prev) => prev.filter((t) => t.id !== id));
    }
  }

  const handleKeyDown = (e) => {
    if (e.key === "Enter") addTask();
  };

  const remaining = tasks.filter((t) => !t.done).length;

  const configMissing =
    SUPABASE_URL === "YOUR_PROJECT_URL" || SUPABASE_KEY === "YOUR_PUBLISHABLE_KEY";

  if (configMissing) {
    return (
      <div className="min-h-screen w-full bg-[#F4F1EA] flex items-center justify-center p-6">
        <div className="max-w-sm text-center">
          <p className="text-[#1F1B16] text-lg mb-2" style={{ fontFamily: "Inter, sans-serif" }}>
            Setup needed
          </p>
          <p className="text-[#8A8475] text-sm" style={{ fontFamily: "Inter, sans-serif" }}>
            Replace SUPABASE_URL and SUPABASE_KEY near the top of this file with your real Supabase values, then reload.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full bg-[#F4F1EA] flex items-start justify-center p-6">
      <div className="w-full max-w-md mt-10">
        <div className="mb-8">
          <h1
            className="text-[#1F1B16] text-4xl mb-1"
            style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}
          >
            Today's list
          </h1>
          <p className="text-[#8A8475] text-sm" style={{ fontFamily: "Inter, sans-serif" }}>
            {loading
              ? "Loading..."
              : remaining === 0
              ? "All done. Nothing left."
              : `${remaining} task${remaining === 1 ? "" : "s"} remaining`}
          </p>
          {error && (
            <p className="text-[#C1502E] text-xs mt-1" style={{ fontFamily: "Inter, sans-serif" }}>
              {error}
            </p>
          )}
        </div>

        <div className="flex gap-2 mb-6">
          <input
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder="Add a task..."
            className="flex-1 bg-white border border-[#E2DDD0] rounded-xl px-4 py-3 text-[#1F1B16] placeholder-[#B5AFA0] outline-none focus:border-[#2F6F4E] transition-colors"
            style={{ fontFamily: "Inter, sans-serif" }}
          />
          <button
            onClick={addTask}
            className="bg-[#1F1B16] text-[#F4F1EA] rounded-xl w-12 flex items-center justify-center hover:bg-[#2F6F4E] transition-colors"
            aria-label="Add task"
          >
            +
          </button>
        </div>

        <div className="space-y-2">
          {!loading && tasks.length === 0 && (
            <div className="text-center py-12 text-[#B5AFA0]">
              <p style={{ fontFamily: "Inter, sans-serif" }} className="text-sm">
                Nothing here yet. Add your first task above.
              </p>
            </div>
          )}
          {tasks.map((task) => (
            <div
              key={task.id}
              className="group flex items-center gap-3 bg-white rounded-xl px-4 py-3 border border-[#E2DDD0]"
            >
              <button
                onClick={() => toggleTask(task.id, task.done)}
                className={`flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${
                  task.done ? "bg-[#2F6F4E] border-[#2F6F4E]" : "border-[#C9C3B4]"
                }`}
                aria-label={task.done ? "Mark as not done" : "Mark as done"}
              >
                {task.done && <span style={{ color: "#F4F1EA", fontSize: 10 }}>✓</span>}
              </button>
              <span
                className={`flex-1 text-[15px] ${
                  task.done ? "text-[#B5AFA0] line-through" : "text-[#1F1B16]"
                }`}
                style={{ fontFamily: "Inter, sans-serif" }}
              >
                {task.text}
              </span>
              <button
                onClick={() => deleteTask(task.id)}
                className="opacity-0 group-hover:opacity-100 text-[#C1502E] transition-opacity flex-shrink-0"
                aria-label="Delete task"
              >
                ✕
              </button>
            </div>
          ))}
        </div>

        <p className="text-center mt-8 text-xs text-[#B5AFA0]" style={{ fontFamily: "Inter, sans-serif" }}>
          connected to Supabase — tasks are saved permanently
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TodoApp />);
</script>
</body>
</html>
