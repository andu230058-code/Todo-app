<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today's list</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: #F4F1EA; }
  .fraunces { font-family: 'Fraunces', serif; }
</style>
</head>
<body>
<div id="root" class="min-h-screen w-full flex items-start justify-center p-6">
  <div class="w-full max-w-md mt-10">

    <div class="mb-8">
      <h1 class="fraunces text-[#1F1B16] text-4xl mb-1" style="font-weight:600;">Today's list</h1>
      <p id="status-text" class="text-[#8A8475] text-sm">Loading...</p>
      <p id="error-text" class="text-[#C1502E] text-xs mt-1 hidden"></p>
    </div>

    <div class="flex gap-2 mb-6">
      <input id="task-input" type="text" placeholder="Add a task..."
        class="flex-1 bg-white border border-[#E2DDD0] rounded-xl px-4 py-3 text-[#1F1B16] placeholder-[#B5AFA0] outline-none focus:border-[#2F6F4E] transition-colors" />
      <button id="add-btn"
        class="bg-[#1F1B16] text-[#F4F1EA] rounded-xl w-12 flex items-center justify-center hover:bg-[#2F6F4E] transition-colors">+</button>
    </div>

    <div id="task-list" class="space-y-2"></div>

    <p class="text-center mt-8 text-xs text-[#B5AFA0]">connected to Supabase — tasks are saved permanently</p>
  </div>
</div>

<script>
// ====================================================================
// STEP A: PASTE YOUR OWN VALUES HERE
// ====================================================================
const SUPABASE_URL = "https://ohvqtnuikmduijbenssc.supabase.co";
const SUPABASE_KEY = "sb_publishable_sPIkB9vNqCSPgrl6vOXxDg_kUA8kPLG";
// ====================================================================

const statusText = document.getElementById("status-text");
const errorText = document.getElementById("error-text");
const taskInput = document.getElementById("task-input");
const addBtn = document.getElementById("add-btn");
const taskList = document.getElementById("task-list");

if (!window.supabase) {
  // Library hasn't loaded yet — retry a few times before giving up
  let attempts = 0;
  const maxAttempts = 10;
  statusText.textContent = "Connecting...";

  const retryInterval = setInterval(() => {
    attempts++;
    if (window.supabase) {
      clearInterval(retryInterval);
      initApp();
    } else if (attempts >= maxAttempts) {
      clearInterval(retryInterval);
      statusText.textContent = "Could not load required library.";
      errorText.textContent = "The Supabase script failed to load after several tries. Try turning off any VPN, switching WiFi/data, or refreshing.";
      errorText.classList.remove("hidden");
    }
  }, 500);
} else {
  initApp();
}

function initApp() {

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let tasks = [];

function showError(msg) {
  if (msg) {
    errorText.textContent = msg;
    errorText.classList.remove("hidden");
  } else {
    errorText.classList.add("hidden");
  }
}

function updateStatus() {
  const remaining = tasks.filter(t => !t.done).length;
  if (remaining === 0) {
    statusText.textContent = tasks.length === 0 ? "Nothing here yet. Add your first task above." : "All done. Nothing left.";
  } else {
    statusText.textContent = `${remaining} task${remaining === 1 ? "" : "s"} remaining`;
  }
}

function renderTasks() {
  taskList.innerHTML = "";
  tasks.forEach(task => {
    const row = document.createElement("div");
    row.className = "group flex items-center gap-3 bg-white rounded-xl px-4 py-3 border border-[#E2DDD0]";

    const checkBtn = document.createElement("button");
    checkBtn.className = `flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${task.done ? "bg-[#2F6F4E] border-[#2F6F4E]" : "border-[#C9C3B4]"}`;
    checkBtn.innerHTML = task.done ? '<span style="color:#F4F1EA;font-size:10px;">&#10003;</span>' : "";
    checkBtn.onclick = () => toggleTask(task.id, task.done);

    const label = document.createElement("span");
    label.className = `flex-1 text-[15px] ${task.done ? "text-[#B5AFA0] line-through" : "text-[#1F1B16]"}`;
    label.textContent = task.text;

    const delBtn = document.createElement("button");
    delBtn.className = "text-[#C1502E] flex-shrink-0";
    delBtn.innerHTML = "&#10005;";
    delBtn.onclick = () => deleteTask(task.id);

    row.appendChild(checkBtn);
    row.appendChild(label);
    row.appendChild(delBtn);
    taskList.appendChild(row);
  });
  updateStatus();
}

async function fetchTasks() {
  const timeout = setTimeout(() => {
    statusText.textContent = "Taking longer than expected...";
    errorText.textContent = "Connection to the database is slow or blocked. Try turning off any VPN or switching network.";
    errorText.classList.remove("hidden");
  }, 8000);

  const { data, error } = await supabase
    .from("tasks")
    .select("*")
    .order("created_at", { ascending: true });
  clearTimeout(timeout);
  if (error) {
    showError(error.message);
  } else {
    tasks = data;
    showError(null);
  }
  renderTasks();
}

async function addTask() {
  const trimmed = taskInput.value.trim();
  if (!trimmed) return;
  const { data, error } = await supabase
    .from("tasks")
    .insert([{ text: trimmed, done: false }])
    .select();
  if (error) {
    showError(error.message);
  } else {
    tasks = tasks.concat(data);
    taskInput.value = "";
    showError(null);
    renderTasks();
  }
}

async function toggleTask(id, currentDone) {
  const { error } = await supabase
    .from("tasks")
    .update({ done: !currentDone })
    .eq("id", id);
  if (error) {
    showError(error.message);
  } else {
    tasks = tasks.map(t => t.id === id ? Object.assign({}, t, { done: !currentDone }) : t);
    renderTasks();
  }
}

async function deleteTask(id) {
  const { error } = await supabase.from("tasks").delete().eq("id", id);
  if (error) {
    showError(error.message);
  } else {
    tasks = tasks.filter(t => t.id !== id);
    renderTasks();
  }
}

addBtn.addEventListener("click", addTask);
taskInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") addTask();
});

fetchTasks();

} // end initApp
</script>
</body>
</html>
